        // Audiobook Chapters Data with line ranges
        const chapters = [
            {

        let currentChapterIndex = 0;
        let isPlayingAll = false;
        let currentUtterance = null;

        // Render Code Viewer with line numbers
        function renderCode() {
            const container = document.getElementById("code-viewer");
            container.innerHTML = codeLines.map((line, idx) => {
                const escaped = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<div id="line-${idx}" class="flex px-2 py-0.5 transition-colors duration-200">
                    <span class="w-8 text-slate-600 select-none text-right pr-4">${idx + 1}</span>
                    <span class="flex-1 text-slate-300">${escaped}</span>
                </div>`;
            }).join("");
        }

        // Render Chapters List
        function renderChapters() {
            const container = document.getElementById("chapters-container");
            container.innerHTML = chapters.map((ch, idx) => `
                <div id="chapter-card-${idx}" class="p-4 rounded-xl border border-slate-800 bg-slate-900/80 hover:border-indigo-500/50 transition-all cursor-pointer group" onclick="selectChapter(${idx})">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Capítulo ${ch.id}</span>
                        <button onclick="event.stopPropagation(); playChapter(${idx})" class="w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-600/30 transition-transform active:scale-95">
                            <i id="play-icon-${idx}" class="fa-solid fa-play text-xs"></i>
                        </button>
                    </div>
                    <h3 class="font-semibold text-slate-200 text-sm group-hover:text-indigo-300 transition-colors">${ch.title}</h3>
                    <p class="text-xs text-slate-400 mt-1 leading-relaxed">${ch.description}</p>
                </div>
            `).join("");
        }

        function highlightLines(start, end) {
            // Reset previous highlights
            for (let i = 0; i < codeLines.length; i++) {
                const el = document.getElementById(`line-${i}`);
                if (el) {
                    el.classList.remove("bg-indigo-950/80", "border-l-2", "border-indigo-400");
                }
            }
            // Highlight target range
            for (let i = start; i <= end; i++) {
                const el = document.getElementById(`line-${i}`);
                if (el) {
                    el.classList.add("bg-indigo-950/80", "border-l-2", "border-indigo-400");
                    if (i === start) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        }

        function selectChapter(idx) {
            currentChapterIndex = idx;
            const ch = chapters[idx];
            highlightLines(ch.startLine, ch.endLine);
            
            // Visual card selection feedback
            chapters.forEach((_, i) => {
                const card = document.getElementById(`chapter-card-${i}`);
                if (card) {
                    if (i === idx) {
                        card.classList.add("border-indigo-500", "bg-slate-800/90");
                    } else {
                        card.classList.remove("border-indigo-500", "bg-slate-800/90");
                    }
                }
            });
            document.getElementById("progress-indicator").textContent = `${idx + 1} / ${chapters.length}`;
        }

        function playChapter(idx) {
            window.speechSynthesis.cancel();
            selectChapter(idx);
            const ch = chapters[idx];
            
            // Reset icons
            chapters.forEach((_, i) => {
                const icon = document.getElementById(`play-icon-${i}`);
                if (icon) icon.className = "fa-solid fa-play text-xs";
            });

            const currentIcon = document.getElementById(`play-icon-${idx}`);
            if (currentIcon) currentIcon.className = "fa-solid fa-spinner fa-spin text-xs";

            currentUtterance = new SpeechSynthesisUtterance(ch.audioText);
            currentUtterance.lang = 'es-ES';
            currentUtterance.rate = 1.0;

            currentUtterance.onend = () => {
                if (currentIcon) currentIcon.className = "fa-solid fa-play text-xs";
                if (isPlayingAll && idx + 1 < chapters.length) {
                    playChapter(idx + 1);
                } else if (isPlayingAll) {
                    stopPlayAll();
                }
            };

            currentUtterance.onerror = () => {
                if (currentIcon) currentIcon.className = "fa-solid fa-play text-xs";
            };

            window.speechSynthesis.speak(currentUtterance);
        }

        function togglePlayAll() {
            if (isPlayingAll) {
                stopPlayAll();
            } else {
                isPlayingAll = true;
                document.getElementById("master-play-text").textContent = "Pausar Audiolibro";
                document.querySelector(".id-master-icon").className = "fa-solid fa-pause id-master-icon";
                playChapter(currentChapterIndex);
            }
        }

        function stopPlayAll() {
            isPlayingAll = false;
            window.speechSynthesis.cancel();
            document.getElementById("master-play-text").textContent = "Reproducción Automática";
            document.querySelector(".id-master-icon").className = "fa-solid fa-play id-master-icon";
            chapters.forEach((_, i) => {
                const icon = document.getElementById(`play-icon-${i}`);
                if (icon) icon.className = "fa-solid fa-play text-xs";
            });
        }

        window.onload = () => {
            renderCode();
            renderChapters();
            selectChapter(0);
        };
    </script>
